<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}FraudShield AI{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="site-body">

    <div class="bg-blur blur-a"></div>
    <div class="bg-blur blur-b"></div>

    <header class="public-topbar">
        <a href="/" class="brand-mark">
            FraudShield <span>AI</span>
        </a>

        <nav class="top-nav">
            <a href="/" class="top-nav-link">Home</a>
            <a href="/login" class="top-nav-link">Login</a>
            <a href="/register" class="top-nav-btn">Create Account</a>
        </nav>
    </header>

    <main class="public-main">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-wrap">
                    {% for category, message in messages %}
                        <div class="flash-msg flash-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}

    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
